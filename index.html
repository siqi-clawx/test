<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClawX · GitHub Pages 测试页</title>
  <meta name="description" content="一个可直接上传到 GitHub 仓库并通过 GitHub Pages 部署的简易测试网页。" />
  <style>
    :root {
      --bg: #0b1020;
      --card: #141a30;
      --text: #e8ecf7;
      --muted: #9aa4bf;
      --accent: #5b8cff;
      --accent-2: #7c5cff;
      --border: rgba(255, 255, 255, 0.08);
    }
    html[data-theme="light"] {
      --bg: #f5f7fc;
      --card: #ffffff;
      --text: #1a2036;
      --muted: #5b6480;
      --accent: #3b6dff;
      --accent-2: #7c5cff;
      --border: rgba(0, 0, 0, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 32px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Microsoft YaHei", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, rgba(91, 140, 255, 0.25), transparent 60%), var(--bg);
      color: var(--text);
      transition: background 0.3s ease, color 0.3s ease;
    }
    .card {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 36px 32px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.28);
      text-align: center;
    }
    .badge {
      display: inline-block;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid var(--border);
      background: rgba(91, 140, 255, 0.1);
      padding: 6px 12px;
      border-radius: 999px;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(24px, 5vw, 32px);
      line-height: 1.2;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    p.sub { margin: 0 0 26px; color: var(--muted); font-size: 15px; line-height: 1.6; }
    .counter {
      font-size: 56px;
      font-weight: 700;
      margin: 8px 0 20px;
      font-variant-numeric: tabular-nums;
    }
    .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    button {
      font: inherit;
      font-size: 15px;
      cursor: pointer;
      border-radius: 12px;
      padding: 12px 22px;
      border: 1px solid var(--border);
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff;
      transition: transform 0.12s ease, opacity 0.2s ease;
    }
    button.ghost {
      background: transparent;
      color: var(--text);
    }
    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(0); opacity: 0.85; }
    footer { color: var(--muted); font-size: 13px; text-align: center; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">GitHub Pages Ready</span>
    <h1>你好，这是一个测试网页 🐾</h1>
    <p class="sub">纯静态单文件页面，无需构建、无需依赖。上传到 GitHub 仓库并开启 Pages 即可访问。</p>

    <div class="counter" id="count" aria-live="polite">0</div>

    <div class="row">
      <button id="inc">点击 +1</button>
      <button class="ghost" id="reset">重置</button>
      <button class="ghost" id="theme">切换主题</button>
    </div>
  </main>

  <footer>
    部署时间：<span id="now">—</span>
    <br />Generated by ClawX
  </footer>

  <script>
    var el = document.getElementById("count");
    var n = 0;
    try { n = parseInt(localStorage.getItem("clawx-count") || "0", 10) || 0; } catch (e) {}
    function render() {
      el.textContent = n;
      try { localStorage.setItem("clawx-count", String(n)); } catch (e) {}
    }
    render();

    document.getElementById("inc").addEventListener("click", function () { n++; render(); });
    document.getElementById("reset").addEventListener("click", function () { n = 0; render(); });

    document.getElementById("theme").addEventListener("click", function () {
      var root = document.documentElement;
      var next = root.getAttribute("data-theme") === "light" ? "dark" : "light";
      root.setAttribute("data-theme", next);
      try { localStorage.setItem("clawx-theme", next); } catch (e) {}
    });
    try {
      var saved = localStorage.getItem("clawx-theme");
      if (saved) document.documentElement.setAttribute("data-theme", saved);
    } catch (e) {}

    document.getElementById("now").textContent = new Date().toLocaleString("zh-CN");
  </script>
</body>
</html>
